<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de pedidos de la Broastería y Cafetería K' RICOS.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <title>Panel de Pedidos - K' RICOS</title>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <h1 class="navbar-brand">Panel de Pedidos - K' Ricos</h1>
        <a href="/" class="btn btn-outline-light btn-sm">Ir a la carta</a>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="row mb-3 align-items-center">
      <div class="col-md-4">
        <select id="filtro-estado" class="form-select">
          <option value="">Todos los estados</option>
          <option value="PENDIENTE">Pendiente</option>
          <option value="EN_PREPARACION">En preparación</option>
          <option value="LISTO">Listo</option>
          <option value="ENTREGADO">Entregado</option>
          <option value="CANCELADO">Cancelado</option>
        </select>
      </div>
      <div class="col-md-4">
        <button id="btn-actualizar" class="btn btn-warning">Actualizar ahora</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-warning">
          <tr>
            <th>Pedido</th>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Entrega</th>
            <th>Items</th>
            <th>Total</th>
            <th>Estado / Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-pedidos-body">
          <tr><td colspan="7" class="text-center">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <div class="linea"></div>
    <div class="info-footer">
      <p>Broastería y Cafetería K' RICOS — Panel interno</p>
    </div>
  </footer>

  <script src="js/util.js"></script>
  <script src="js/api.js" type="module"></script>
  <script src="js/panel.js" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>
</html>
